# 持续集成
#
# ============================ 两个前提,先读这里 ============================
#
# 1) 本方案**不使用服务容器**。这是架构文档 9.4 的既定决策("不用 Testcontainers,本机无容器环境"),
#    代价是同节末尾自己标注的那条未展开依赖:
#
#      「CI 环境注意:这个方案要求 CI 执行环境能连到同一台 MySQL 实例(网络可达)……
#        需要确保 CI runner 和这台 MySQL 之间的网络策略打通」
#
#    所以下面 integration 作业**不自带 MySQL/Redis**,而是通过 secrets 指向一台可达的实例。
#    如果该实例对公网不可达,这个作业会失败 —— 那是网络策略问题,不是测试问题。
#
# 2) 本文件**尚未在真实 runner 上验证过**(仓库当前没有 remote,Docker 守护进程也未运行),
#    它记录的是"要跑起来需要哪些输入"这一契约。真正验证过的是它依赖的前置修复:
#    测试此前固定跑在 dev profile 上,会去连 127.0.0.1 的开发库并污染 dev 的 Redis DB 0 —— 
#    在 CI runner 上必然失败。该问题已在 api/pom.xml 与 22 个测试类中修掉,并验证零环境变量可跑通。
#
# ============================ 两层测试 ============================
#
# unit        : mvn test                 —— 纯单元测试,不需要 MySQL/Redis,约 1 分钟
# integration : mvn test -Dexcluded.groups= —— 全量(含 @Tag("integration")),需要 MySQL/Redis
#
# 分层的依据是 pom 里 excluded.groups 默认为 integration:23 个 Spring 上下文测试
# (@SpringBootTest 20 个 + @DataJpaTest 3 个)全部带该标签,所以默认层真的不碰基础设施。

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # ------------------------------------------------------------------
  # 快层:不依赖任何外部服务,任何 runner 都能跑。给最快速的反馈。
  # ------------------------------------------------------------------
  unit:
    name: 单元测试(无需基础设施)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 准备 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: 运行单元测试
        working-directory: api
        run: mvn -B test

      - name: 上传测试报告(仅失败时)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-unit
          path: api/target/surefire-reports/

  # ------------------------------------------------------------------
  # 全量层:需要 MySQL 与 Redis 网络可达(见文件顶部说明 1)。
  # ------------------------------------------------------------------
  integration:
    name: 全量测试(需 MySQL/Redis)
    runs-on: ubuntu-latest
    needs: unit
    # 没有配 secrets 时跳过而不是失败:否则 fork 的 PR 会因为拿不到 secrets 而永远红着,
    # 慢慢就没人看 CI 结果了
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    env:
      TEST_MYSQL_HOST: ${{ secrets.TEST_MYSQL_HOST }}
      TEST_MYSQL_DB: ${{ secrets.TEST_MYSQL_DB }}
      TEST_MYSQL_USER: ${{ secrets.TEST_MYSQL_USER }}
      TEST_MYSQL_PASSWORD: ${{ secrets.TEST_MYSQL_PASSWORD }}
      TEST_REDIS_HOST: ${{ secrets.TEST_REDIS_HOST }}
      TEST_REDIS_PORT: ${{ secrets.TEST_REDIS_PORT }}
    steps:
      - uses: actions/checkout@v4

      - name: 准备 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: 校验外部服务配置已提供
        run: |
          missing=""
          for name in TEST_MYSQL_HOST TEST_MYSQL_DB TEST_MYSQL_USER TEST_MYSQL_PASSWORD TEST_REDIS_HOST; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "缺少以下 secrets:$missing"
            echo "全量测试要把库与 Redis 指到一台可达的实例(见 architecture.md 9.4)。"
            exit 1
          fi

      - name: 确保测试库存在
        # 库只需存在,Flyway 会在每次运行开始时重建全部表(见 TestDatabaseReset)。
        # 注意:该步骤会清空这个库 —— 所以 TEST_MYSQL_DB 必须是**每个流水线专用的库名**,
        # 绝不能指向开发库或任何有数据的库(architecture.md 9.4 明确要求按流水线隔离库名)。
        run: |
          mysql -h "$TEST_MYSQL_HOST" -u "$TEST_MYSQL_USER" -p"$TEST_MYSQL_PASSWORD" \
            -e "CREATE DATABASE IF NOT EXISTS \`$TEST_MYSQL_DB\` CHARACTER SET utf8mb4"

      - name: 运行全量测试
        working-directory: api
        # 库名与 Redis 地址全部来自上面的环境变量(application-test.yml 已参数化),
        # 不需要再传 SPRING_DATASOURCE_URL —— 传了反而会绕过 profile 校验,
        # 掩盖"profile 没切过来"这类问题
        run: mvn -B test -Dexcluded.groups=

      - name: 上传覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco
          path: api/target/site/jacoco/

      - name: 上传测试报告(仅失败时)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-integration
          path: api/target/surefire-reports/

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/minimall_dev?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0

sa-token:
  # 长一点,调试时不用频繁重新登录(dev 不需要模拟真实的短 TTL,见架构文档 9.3)
  timeout: 86400

minimall:
  auth:
    refresh-token:
      ttl-seconds: 2592000   # dev 30 天

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

management:
  endpoints:
    web:
      exposure:
        include: "*"

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/minimall_dev?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0

sa-token:
  # 长一点,调试时不用频繁重新登录(dev 不需要模拟真实的短 TTL,见架构文档 9.3)
  timeout: 86400

minimall:
  auth:
    refresh-token:
      ttl-seconds: 2592000   # dev 30 天
  mall:
    auth:
      # 本地开发没有真实的小程序 appId/appSecret,打开 mock 才能走通登录链路:
      # code 会被直接映射成模拟 openid(见 WxAuthClient)。
      # 生产环境(config/application-prod.yml)必须保持 false —— 那里没有这个配置项,默认即 false。
      wx-mock: true

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

management:
  endpoints:
    web:
      exposure:
        include: "*"

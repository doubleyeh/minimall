spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:3306/${MYSQL_DB:minimall}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=true
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 连接池按数据库承载能力配置,不按虚拟线程数量放大(架构文档 1.2)
      maximum-pool-size: ${DB_POOL_SIZE:20}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0

sa-token:
  timeout: ${SESSION_TIMEOUT:7200}

logging:
  level:
    org.hibernate.SQL: warn
    com.minimall: info

management:
  endpoints:
    web:
      exposure:
        # 只暴露健康检查,其余关闭或加鉴权(架构文档 9.3)
        include: health

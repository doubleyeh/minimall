spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/minimall?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=true
    username: minimall
    password: minimall
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 连接池按数据库承载能力配置,不按虚拟线程数量放大(架构文档 1.2)
      maximum-pool-size: 20
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: ''
      database: 0

sa-token:
  timeout: 7200

logging:
  level:
    org.hibernate.SQL: warn
    com.minimall: info

management:
  endpoints:
    web:
      exposure:
        # 只暴露健康检查,其余关闭或加鉴权(架构文档 9.3)
        include: health

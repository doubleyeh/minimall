spring:
  application:
    name: mini-mall
  profiles:
    active: dev
  # 项目不用 Spring Data Redis 的仓储抽象:缓存、令牌、限流、单号全部直接走 StringRedisTemplate
  # (见 infra 下各服务),没有任何 @RedisHash 实体。
  #
  # 不关掉它时,Spring Data Redis 会去扫描**全部** Spring Data 仓储接口寻找自己的候选,
  # 对每一个 JPA 仓储接口打一行 INFO「Could not safely identify store assignment for repository
  # candidate interface ...」——本仓库 38 个仓储接口就是启动时 38 行噪音。
  # 它是 INFO 不是 WARN,但危害一样:真正的告警被淹在里面,启动日志也看不出重点。
  data:
    redis:
      repositories:
        enabled: false
  jpa:
    # 显式配置,不依赖框架默认值:HTTP 路径依赖它保证整个请求周期是同一个 Hibernate Session,
    # 租户过滤器在入口 enable 一次才够用(架构文档 4.2)。
    open-in-view: true
    hibernate:
      # 三环境统一 validate:引入 Flyway 后 Hibernate 不允许在任何环境自动改表(架构文档 9.3)
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Shanghai
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      # 必须与 minimall.file.max-size-bytes 对齐:Spring 的默认上限是 1MB,
      # 不对齐的话传 2MB 的图会先被它拦下,报的还是"文件过大"这种看不出上限在哪的错
      max-file-size: 5MB
      max-request-size: 6MB

# Sa-Token 关键配置(取值见架构文档 7.1.1,不要留白)
sa-token:
  token-name: Authorization
  # 令牌前缀。客户端统一按 `Authorization: Bearer <token>` 传入(7.1),Sa-Token 读取时自动去掉前缀。
  # 不配这一项时它会把整个 "Bearer xxx" 当成令牌串,校验必然失败 → 表现是"刚登录成功,下一个请求就 401"。
  token-prefix: Bearer
  # 访问令牌 TTL(秒)。短 TTL 是刷新机制生效的前提(架构文档 7.1.3);dev/test 在各自 profile 里覆盖。
  timeout: 1800
  # 不启用滑动过期(-1):续期必须走显式刷新接口,否则续期时无法做安全判断(7.1.3)
  active-timeout: -1
  is-concurrent: true      # 允许同一账号多端同时登录
  is-share: false          # 每端 token 不同,便于精确踢单端
  token-style: uuid
  is-read-header: true
  is-read-cookie: false    # 前后端分离,不依赖 cookie 传 token

minimall:
  # 雪花算法:多实例部署时每个实例必须不同(架构文档 4.3、9.3)
  snowflake:
    worker-id: ${SNOWFLAKE_WORKER_ID:1}
    datacenter-id: ${SNOWFLAKE_DATACENTER_ID:1}
  # 租户上下文与过滤(架构文档 4.2、4.9、4.11)
  tenant:
    # 白名单:允许没有 tenantId 就执行的路径,必须显式维护,不做模糊匹配
    public-paths:
      - /auth/login
      # 取验证码必然发生在登录之前,没有登录态
      - /auth/captcha
      # 文件访问是公开的:商品图/售后凭证要能在小程序里直接显示,不能要求带令牌。
      # 上传不在这里(它是 POST /file-uploads),否则会连上传一起放开
      - /files/**
      # 刷新接口必须在白名单里:调用它时访问令牌通常已经过期,登录态校验必然失败(7.1.3)
      - /auth/refresh
      - /pay/callback/**
      - /actuator/**
      # 小程序端整体放行到 TenantWebFilter 的"未登录"分支:它们的身份由 ClientAuthFilter
      # 用客户端令牌单独校验(3.1)。注意**白名单只表示"允许没有登录态就执行"**,
      # 不代表免鉴权 —— ClientAuthFilter 对 /mall/api/** 除公开清单外一律要求有效令牌。
      - /mall/api/**
    tenant-status-cache-seconds: 60
  # 权限缓存(架构文档 5.5):key 带租户级版本号,失效只需 INCR 版本号
  permission:
    cache-ttl-seconds: 7200
  # 刷新令牌(架构文档 7.1.3)
  auth:
    refresh-token:
      ttl-seconds: 604800        # 7 天
      reuse-grace-seconds: 120   # 已用令牌的重放宽限期,只为容忍客户端网络重试,不要调大
  # 登录防护(架构文档 7.1.1)
  login:
    max-fail-count: 5
    lock-minutes: 15
    ip-limit-per-minute: 10
    # 登录失败到这个次数之后,未带验证码的登录一律拒绝(带了就必须是对的)。
    # 不设成"每次登录都要验证码":那会让正常用户每次都被拦一下,而机器人照样能绕。
    captcha-after-failures: 3
    # 验证码有效期(秒)。验证成功后立即删除,同一个验证码不能用两次
    captcha-ttl-seconds: 120
  # 文件存储(架构文档 7.5):本地磁盘实现。换对象存储时实现 FileStorage 接口即可,业务侧不动
  file:
    # 生产必须挂持久卷,否则重启即丢。目录会按租户 + 日期分好,便于排查与清理
    root-dir: ./data/files
    # 单文件上限,必须与 spring.servlet.multipart.max-file-size 对齐
    max-size-bytes: 5242880
    # 拼在访问路径前的前缀。留空返回相对路径(同源部署够用);
    # 小程序端要绝对地址时改成 https://你的域名
    public-base-url: ""
  # 小程序客户端登录态(商城设计文档 3.1)
  mall:
    auth:
      # 客户端 JWT 签名密钥。**上线前必须用环境变量覆盖**:密钥泄露等于任何人都能伪造任意客户的令牌。
      # HS256 要求至少 256 位(32 字节),长度不足应用启动即失败。
      jwt-secret: ${MALL_JWT_SECRET:mini-mall-client-token-secret-change-it-please}
      # 小程序场景要求"免登录 30 天",过期后前端静默重登,不做服务端登出
      ttl-days: 30
      # 小程序的 appId/appSecret 改为按租户配置(sys_wx_pay_config),不再放这里
      # 模拟 code2Session(仅本地/自动化测试)。**生产必须保持 false**,
      # 打开它等于任何人编一个 code 就能登录成任意客户
      wx-mock: ${WX_MOCK:false}
    # 微信支付。每租户的商户号/密钥/证书在 sys_wx_pay_config 里,这里只放全局项
    pay:
      # 回调地址前缀,必须是公网 HTTPS;租户级只拼 /pay/callback/wx/{tenantCode}。
      # 直接改这里;Docker 下可用 MINIMALL_MALL_PAY_NOTIFY_BASE_URL 覆盖
      notify-base-url:
      connect-timeout-seconds: 3
      read-timeout-seconds: 10
      # 租户支付配置的缓存 TTL;未配置时用更短的负缓存挡穿透
      config-cache-seconds: 600
      config-cache-miss-seconds: 60
  # 敏感配置的信封加密主密钥(Base64 的 32 字节)。留空则明文存储,仅限本地开发;
  # 上线前必须填,且它与已有密文绑定 —— 换了之后旧密文解不开。Docker 下可用
  # MINIMALL_SECRET_MASTER_KEY 覆盖
  secret:
    master-key:

server:
  port: 8080

logging:
  level:
    com.minimall: info
